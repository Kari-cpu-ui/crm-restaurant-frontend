<h2>Menú del día (Público)</h2>

<div style="display:flex; gap:8px; align-items:center;">
  <label>Fecha:</label>
  <input type="date" [(ngModel)]="date" />
  <button (click)="search()">Ver menú</button>
</div>

<p *ngIf="loading">Cargando...</p>
<p *ngIf="error" style="color:red">{{ error }}</p>

<div *ngIf="menu" style="border:1px solid #ddd; padding:10px; margin-top:10px;">
  <p><b>Fecha:</b> {{ menu.date }}</p>
  <p><b>Primero:</b> {{ menu.first_course }}</p>
  <p><b>Segundo:</b> {{ menu.second_course }}</p>
  <p><b>Postre:</b> {{ menu.dessert }}</p>
  <p><b>Precio:</b> {{ menu.price }} €</p>
</div>
