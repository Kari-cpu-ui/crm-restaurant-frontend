<header class="navbar">
  <div class="nav-left">
    <a routerLink="/" routerLinkActive="active">Home</a>
    <a routerLink="/menus" routerLinkActive="active">Carta</a>
    <a routerLink="/mis-reservas" routerLinkActive="active">Reservas</a>
    <a routerLink="/review" routerLinkActive="active">Reseñas</a>
    <a routerLink="/sobre-nosotros" routerLinkActive="active">Sobre nosotros</a>
  </div>
</header>

<div class="menu-page">
  <!-- Selector de fecha -->
  <div class="date-selector">
    <label for="menu-date">Selecciona una fecha:</label>
    <input type="date" id="menu-date" [value]="selectedDate" (change)="onDateChange($event)" />
  </div>

  <!-- Mensaje de error -->
  <div class="error-message" [hidden]="!error">{{ error }}</div>

  @if(menu().id) {
  <div class="menu-details">
    <p><strong>Name:</strong> {{ menu().name }}</p>
    <p><strong>Descripción:</strong> {{ menu().description }}</p>
    <p><strong>Precio:</strong> {{ menu().price }}</p>
    <p>
      <img [src]="menu().image_url" [alt]="menu().name" style="max-width:500px; border-radius:8px;" />

    </p>
  </div>
  }@else {
  <p>Aquí aparecerá el menú del día cuando seleccionas una fecha.</p>
  }
</div>
