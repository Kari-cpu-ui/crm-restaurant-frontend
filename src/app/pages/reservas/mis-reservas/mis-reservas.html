<header class="navbar">
  <div class="nav-left">
    <a routerLink="/">Home</a>
    <a routerLink="/reservas/nueva">Crear Reserva</a>
  </div>

  <div class="nav-right">
    <button class="btn-logout" [hidden]="!isLogged()" (click)="logout()">
      Logout
    </button>

  </div>
</header>

<section class="mis-reservas-page">
  <h2>Mis Reservas</h2>

  @for (reserva of arrReservas(); track reserva.id) {
    <div class="reserva-card">
      <div class="reserva-info">
        <p><strong>Código de Reserva:</strong> {{ reserva.reservation_code }}</p>
        <p><strong>Hora:</strong> {{ reserva.time }}</p>
        <p><strong>Fecha:</strong> {{ reserva.date }}</p>
        <p><strong>Personas:</strong> {{ reserva.guests }}</p>
      </div>
      <button type="button" class="btn-reserva-small" (click)="cancelarReserva(reserva.id)">Cancelar</button>
    </div>
  } @empty {
    <p>No tienes reservas.</p>
  }
</section>
