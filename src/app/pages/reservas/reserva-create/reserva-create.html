<section class="reserva-create-page">
  <h2>Crear Reserva</h2>

  <div class="reserva-form-container">
    <label>
      Mesa:
      <input type="text" id="mesaId" placeholder="ID de la mesa">
    </label>

    <label>
      Fecha:
      <input type="date" id="fecha">
    </label>

    <label>
      Hora:
      <input type="time" id="hora">
    </label>

    <label>
      Personas:
      <input type="number" id="personas" min="1" placeholder="Número de personas">
    </label>

    <button type="button" class="btn-auth" (click)="crearReserva()">
      Crear Reserva
    </button>
  </div>
</section>
