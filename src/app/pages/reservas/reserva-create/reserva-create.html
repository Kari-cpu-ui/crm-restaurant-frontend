<header class="navbar">
  <div class="nav-left">
    <a routerLink="/">Home</a>
    <a routerLink="/mis-reservas">Mis Reservas</a>
  </div>

  <div class="nav-right">
    <button class="btn-logout" [hidden]="!isLogged()" (click)="logout()">
      Logout
    </button>

  </div>
</header>

<section class="reserva-create-page">
  <h2>Crear Reserva</h2>

  <div class="reserva-form-container">
    <label>
      Hora:
      <input type="time" id="time"
        [value]="nuevaReserva().time"
        (input)="actualizarCampo('time', $event)">
    </label>

    <label>
      Fecha:
      <input type="date" id="date"
        [value]="nuevaReserva().date"
        (input)="actualizarCampo('date', $event)">
    </label>

    <label>
      Personas:
      <input type="number" id="guests" min="1" placeholder="Número de personas"
        [value]="nuevaReserva().guests"
        (input)="actualizarCampo('guests', $event)">
    </label>

    <button type="button" class="btn-auth" (click)="crearReserva()">
      Crear Reserva
    </button>
  </div>
</section>
