<h2>Crear Reserva</h2>

<form>
  <!-- Fecha -->
  <label for="fecha">Fecha:</label>
  <input 
    id="fecha" 
    type="date" 
    [value]="nuevaReserva().fecha" 
    (input)="nuevaReserva.set({ ...nuevaReserva(), fecha: $any($event.target).value })"
  />

  <!-- Personas -->
  <label for="personas">Personas:</label>
  <input 
    id="personas" 
    type="number" 
    min="1" 
    [value]="nuevaReserva().personas" 
    (input)="nuevaReserva.set({ ...nuevaReserva(), personas: +$any($event.target).value })"
  />

  <!-- Mesa -->
  <label for="mesa">Mesa:</label>
  <input 
    id="mesa" 
    type="number" 
    min="1" 
    [value]="nuevaReserva().mesaId" 
    (input)="nuevaReserva.set({ ...nuevaReserva(), mesaId: +$any($event.target).value })"
  />

  <!-- User ID (oculto) -->
  <input 
    type="hidden" 
    [value]="nuevaReserva().userId" 
  />

  <!-- Botón Crear Reserva -->
  <button type="button" (click)="crearReserva()">Crear Reserva</button>
</form>
