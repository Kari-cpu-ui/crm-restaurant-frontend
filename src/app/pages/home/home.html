<header class="navbar">
    <div class="nav-left">
        <a routerLink="/menus">Carta</a>
        <a routerLink="/mis-reservas" (click)="verMisReservas()">Reservas</a>
        <a routerLink="/review">Reseñas</a>
        <a routerLink="">Sobre nosotros</a>
        <a routerLink="/admin" [hidden]="!isAdmin()">Admin</a>
        <!-- <button class="btn-admin" [hidden]="!isAdmin()" routerLink="/admin">
            Admin
        </button> -->

    </div>

    <div class="nav-right">

        <!-- Login y Registro visibles solo si NO está logado -->
        <button [hidden]="isLogged()" (click)="goToLogin()">
            Login
        </button>

        <button class="btn-register" [hidden]="isLogged()" (click)="goToRegister()">
            Registro
        </button>

        <!-- Logout visible solo si está logado -->
        <button class="btn-logout" [hidden]="!isLogged()" (click)="logout()">
            Logout
        </button>

    </div>
</header>


<section class="hero">
    <div class="overlay">
        <h1 class="logo">TERRA ROSSA</h1>
        <p class="subtitle">No inventamos la pizza, protegemos su alma.</p>
        <button class="btn-reserva" (click)="hacerReserva()">RESERVA</button>
    </div>
</section>
