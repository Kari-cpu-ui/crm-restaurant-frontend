<header class="navbar">
    <div class="nav-left">
        <a routerLink="/" routerLinkActive="active">Home</a>
        <a routerLink="/menus" routerLinkActive="active">Carta</a>
        <a (click)="verMisReservas()">Reservas</a>
        <a routerLink="/review" routerLinkActive="active">Reseñas</a>
        <a routerLink="/sobre-nosotros" routerLinkActive="active">Sobre nosotros</a>
        @if (isAdmin()) {
        <a routerLink="/admin" routerLinkActive="active">Admin</a>
        }
    </div>

    <div class="nav-right">

        <!-- Login y Registro visibles solo si NO está logado -->
        <button [hidden]="isLogged()" (click)="goToLogin()">
            Login
        </button>

        <button class="btn-register" [hidden]="isLogged()" (click)="goToRegister()">
            Registro
        </button>

        <!-- Logout visible solo si está logado -->
        <button class="btn-logout" [hidden]="!isLogged()" (click)="logout()">
            Logout
        </button>

    </div>
</header>


<section class="hero">
    <div class="overlay">
        <h1 class="logo">TERRA ROSSA</h1>
        <p class="subtitle">No inventamos la pizza, protegemos su alma.</p>
        <button class="btn-reserva" (click)="hacerReserva()">RESERVA</button>
    </div>
</section>
